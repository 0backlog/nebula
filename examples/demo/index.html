<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nebula demo</title>
    <meta
      name="description"
      content="Every formation and every dial of @0backlog/nebula, a WebGL point field for React that morphs, reacts and talks."
    />
    <!-- this page is the library's front door, so the link has to say what it
         opens onto when someone pastes it somewhere -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nebula demo" />
    <meta
      property="og:description"
      content="Every formation and every dial of @0backlog/nebula, a WebGL point field for React that morphs, reacts and talks."
    />
    <meta property="og:url" content="https://0backlog.com/nebula/" />
    <!-- three dots, inline: a favicon file for a one page demo is a file to
         lose, and the gray reads on a light tab strip and a dark one alike.
         The angle brackets are percent encoded because a raw one in a data URI
         is a browser by browser gamble, and a favicon that fails is silent -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%239aa0a6'%3E%3Ccircle cx='11' cy='13' r='4'/%3E%3Ccircle cx='21' cy='11' r='2.5'/%3E%3Ccircle cx='19' cy='21' r='5'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
